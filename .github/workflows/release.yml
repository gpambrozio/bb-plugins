# Tags and releases a plugin when its version changes on `main`.
#
# Plugins here are not published anywhere: bb installs them from git, and the Community marketplace
# entry for each pins a semver range over this repository's `<id>/vX.Y.Z` tags. So a release *is* a
# tag — annotated, on the merge commit — plus a GitHub release whose notes are that version's
# changelog section. Once the tag exists, every install following a compatible range picks it up on
# its next update check, with no marketplace pull request.
#
# Two ways in, one path out:
#
# - **A version bump merged to `main`** is the normal one. Every push to `main` looks for a plugin
#   whose `package.json` version has no tag yet, or a tag but no GitHub release, and releases each
#   one it finds. Nothing to run by hand and nothing to remember: a bump that merged and was then
#   forgotten used to leave the marketplace a version behind the repository with nothing saying so.
# - **`workflow_dispatch`** takes a plugin by id and releases the version its `package.json`
#   declares, for when no push is coming to finish a failed run.
#
# Safe to run twice, by construction. **A new tag goes on the commit that introduced the version**
# (`release-commit.mjs`), not on whatever commit this run started from, so a run that was cancelled,
# queued behind another or failed is finished correctly by any later one: a push that changed the
# plugin without bumping it is never folded into a release. **A tag that exists is never moved,
# re-pointed or deleted** — bb refuses a tag that now names a different commit, and every install
# pinned to it would see the code under it change. When the tag exists, the job verifies and
# releases the commit *it* names, and creates only what is missing.
#
# The order is the safe one: verify, then tag, then release. A build or test failure leaves no tag,
# so nothing installs a commit that failed; a failure between the tag and the release leaves a tag
# without a release, which the plan of any later run — or "Re-run all jobs" — picks up.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin id to release, at the version in its package.json
        required: true
        type: string

# Granted per job instead. Only the release job writes anything.
permissions: {}

# Two pushes landing together would otherwise both see the same missing tag. Never
# `cancel-in-progress`: the thing being cancelled could be a half-finished release. A third push
# still replaces a run waiting in the queue; that run's work is not lost, because the next one
# releases whatever is untagged or unreleased, on the commits that introduced it. One case is lost: a
# version bumped again before any run reached it is never tagged — the newer version is released.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.pick.outputs.plugins }}
    steps:
      # Tags are the whole input, so the full history is needed rather than the single commit a
      # default checkout brings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pick the plugins
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.plugin }}
          # To ask GitHub which tags already have a release.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            # A release tags the commit this run is on, and only `main` is reviewed and checked.
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are cut from main; this run is on $GITHUB_REF."
              exit 1
            fi
            plugins="$(node .github/scripts/list-plugins.mjs | jq -c --arg id "$CHOICE" 'map(select(. == $id))')"
            if [ "$plugins" = "[]" ]; then
              echo "::error::'$CHOICE' is not a plugin in .bb/plugins.json"
              exit 1
            fi
          else
            plugins="$(node .github/scripts/list-plugins.mjs --unreleased)"
          fi
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"
          echo "Releasing: $plugins" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: ${{ matrix.plugin }}
    needs: plan
    if: needs.plan.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    permissions:
      # To push the tag and create the release.
      contents: write
    strategy:
      # Two plugins can bump in one merge, and they release separately — one failing must not
      # cancel the other's release.
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bb

      # Everything below runs in a worktree of the commit being released: the commit that introduced
      # the version for a new tag, or the commit an existing tag already names. The scripts still come from this
      # run's checkout, so an old tag released by hand is read by today's rules.
      - name: Find the commit to release
        id: resolve
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./$PLUGIN/package.json').version")"
          tag="$PLUGIN/v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            commit="$(git rev-parse "$tag^{commit}")"
            tagged=true
            echo "$tag already names $commit; releasing that commit and leaving the tag where it is."
          else
            commit="$(node .github/scripts/release-commit.mjs "$PLUGIN")"
            tagged=false
            echo "$PLUGIN $version was introduced by $commit; tagging that commit."
          fi
          worktree="$RUNNER_TEMP/release"
          git worktree add --detach "$worktree" "$commit"
          tagged_version="$(node -p "require('$worktree/$PLUGIN/package.json').version")"
          if [ "$tagged_version" != "$version" ]; then
            echo "::error::$tag names $commit, where $PLUGIN/package.json says $tagged_version. Fix the tag by hand; this workflow never moves one."
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$commit"
            echo "tagged=$tagged"
            echo "dir=$worktree/$PLUGIN"
          } >> "$GITHUB_OUTPUT"

      # Before anything slow: a version with no changelog section has nothing to say, so it is
      # not released.
      - name: Build the release notes from the changelog
        id: notes
        env:
          DIR: ${{ steps.resolve.outputs.dir }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes-$PLUGIN.md"
          node .github/scripts/release-notes.mjs "$DIR" "$GITHUB_REPOSITORY" > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      # The same install and build a user's bb runs from this tag, so a release that would fail to
      # install fails here instead. See checks.yml.
      - name: Install as a git install does
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm ci --omit=dev --omit=optional --ignore-scripts

      - name: Build as a git install does
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: bb plugin build

      - name: Install
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm run typecheck

      - name: Test
        working-directory: ${{ steps.resolve.outputs.dir }}
        run: npm test

      # Annotated, like the tags cut by hand before this workflow existed. A plain `git push` of a
      # tag never overwrites one on the remote, so a run racing another fails here instead of
      # moving anything; the tag ruleset forbids it as well.
      - name: Tag the commit
        if: steps.resolve.outputs.tagged == 'false'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT: ${{ steps.resolve.outputs.commit }}
          PLUGIN: ${{ matrix.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" -m "Release $PLUGIN v$VERSION" "$COMMIT"
          git push origin "refs/tags/$TAG"

      # A release created with the default token starts no workflow run, which is fine: nothing
      # here listens for one.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PLUGIN: ${{ matrix.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "The release for $TAG already exists; nothing to create."
            exit 0
          fi
          # `--verify-tag`: release the tag pushed above, and never let gh create one of its own.
          gh release create "$TAG" --verify-tag --title "$PLUGIN $VERSION" --notes-file "$NOTES"
          echo "Released $TAG." >> "$GITHUB_STEP_SUMMARY"
